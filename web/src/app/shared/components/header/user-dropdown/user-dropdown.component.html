<div class="relative">
  <button
    (click)="toggleDropdown()"
    class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/[0.05]"
  >
    <span
      class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-500 text-sm font-semibold text-white"
      >{{ initials }}</span
    >
    <span class="hidden text-sm font-medium sm:block">{{ auth.user()?.name }}</span>
    <svg class="h-4 w-4 text-gray-400 transition-transform" [class.rotate-180]="isOpen"
      viewBox="0 0 20 20" fill="none">
      <path d="M5 7.5 10 12.5 15 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (isOpen) {
    <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>
    <div
      class="absolute right-0 z-50 mt-2 w-64 rounded-2xl border border-gray-200 bg-white p-2 shadow-lg dark:border-gray-800 dark:bg-gray-900"
    >
      <div class="border-b border-gray-100 px-3 py-3 dark:border-gray-800">
        <p class="text-sm font-semibold text-gray-900 dark:text-white">
          {{ auth.user()?.name }}
          <span class="ml-1 rounded-full px-2 py-0.5 text-[11px] font-medium"
            [class]="auth.isAdmin
              ? 'bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400'
              : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300'">
            {{ auth.isAdmin ? 'Administrador' : 'Vendedor' }}
          </span>
        </p>
        <p class="mt-0.5 truncate text-xs text-gray-500 dark:text-gray-400">{{ auth.user()?.email }}</p>
        @if (auth.user()?.businessName) {
          <p class="text-xs text-gray-400">🏪 {{ auth.user()?.businessName }}</p>
        }
      </div>

      @if (auth.isAdmin) {
        <a routerLink="/usuarios" (click)="closeDropdown()"
          class="mt-1 flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-white/[0.05]">
          <svg class="h-4.5 w-4.5 text-gray-400" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Gestionar usuarios
        </a>
      }

      <button (click)="logout()"
        class="mt-1 flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-error-600 hover:bg-error-50 dark:text-error-400 dark:hover:bg-error-500/10">
        <svg class="h-4.5 w-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  }
</div>
