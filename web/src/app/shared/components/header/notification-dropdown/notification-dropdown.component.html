<div class="relative">
  <button
    (click)="toggle()"
    class="relative flex h-11 w-11 items-center justify-center rounded-full border border-gray-200 text-gray-500 hover:bg-gray-100 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.05]"
    aria-label="Alertas de vencimiento"
  >
    @if (alerts.length) {
      <span
        class="absolute -right-0.5 -top-0.5 flex h-5 min-w-5 items-center justify-center rounded-full px-1 text-[10px] font-bold text-white"
        [class]="criticas ? 'bg-error-500' : 'bg-warning-500'"
        >{{ alerts.length }}</span
      >
    }
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </svg>
  </button>

  @if (isOpen) {
    <div class="fixed inset-0 z-40" (click)="close()"></div>
    <div
      class="absolute right-0 z-50 mt-2 w-80 rounded-2xl border border-gray-200 bg-white p-2 shadow-lg dark:border-gray-800 dark:bg-gray-900"
    >
      <div class="flex items-center justify-between border-b border-gray-100 px-3 py-2.5 dark:border-gray-800">
        <p class="text-sm font-semibold text-gray-900 dark:text-white">Vencimientos próximos</p>
        <span class="text-xs text-gray-400">15 días</span>
      </div>

      <div class="max-h-80 overflow-y-auto">
        @for (a of alerts.slice(0, 8); track a.id) {
          <a routerLink="/vencimientos" (click)="close()"
            class="flex items-start gap-2.5 rounded-lg px-3 py-2.5 hover:bg-gray-50 dark:hover:bg-white/[0.05]">
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full"
              [class]="a.level === 'vencido' || a.level === 'critico' ? 'bg-error-500' : a.level === 'alerta' ? 'bg-warning-500' : 'bg-blue-light-500'"></span>
            <span class="min-w-0">
              <span class="block truncate text-sm font-medium text-gray-800 dark:text-white/90">{{ a.product.name }}</span>
              <span class="block text-xs text-gray-500">Lote {{ a.lotCode }} · {{ a.quantity }} un. · {{ label(a) }}</span>
            </span>
          </a>
        } @empty {
          <p class="px-3 py-6 text-center text-sm text-gray-400">Sin vencimientos próximos 🎉</p>
        }
      </div>

      @if (alerts.length) {
        <a routerLink="/vencimientos" (click)="close()"
          class="mt-1 block rounded-lg border-t border-gray-100 px-3 py-2.5 text-center text-sm font-medium text-brand-500 hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-white/[0.05]">
          Ver todos los vencimientos
        </a>
      }
    </div>
  }
</div>
